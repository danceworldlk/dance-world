</head><body><!-- Navigation -->

<!-- Contact Section -->

<section class="contact-section">

    <h1>📩 Contact Us</h1>

    <p>
        Dance World සමඟ සම්බන්ධ වීමට
        පහත පෝරමය භාවිතා කරන්න.
    </p>


    <!-- Contact Form -->

    <div class="contact-box">

        <form onsubmit="sendMessage(event)">

            <label for="name">
                ඔබගේ නම
            </label>

            <input
                type="text"
                id="name"
                placeholder="නම ඇතුළත් කරන්න"
                required
            >


            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                placeholder="Email එක ඇතුළත් කරන්න"
                required
            >


            <label for="message">
                පණිවිඩය
            </label>

            <textarea
                id="message"
                rows="6"
                placeholder="ඔබගේ පණිවිඩය මෙහි ලියන්න"
                required
            ></textarea>


            <button type="submit">
                Send Message 📩
            </button>

        </form>

    </div>


    <!-- Contact Information -->

    <div class="contact-info">

        <div class="info-card">

            <h3>📧 Email</h3>

            <p>
                danceworld@gmail.com
            </p>

        </div>


        <div class="info-card">

            <h3>📞 Phone</h3>

            <p>
                +94 77 123 4567
            </p>

        </div>


        <div class="info-card">

            <h3>📍 Location</h3>

            <p>
                Sri Lanka
            </p>

        </div>

    </div>

</section>


<!-- Footer -->

<footer>

    <p>
        © 2026 Dance World | All Rights Reserved
    </p>

    <p>
        💃 Discover the Beauty of Dance 🌍
    </p>

</footer>


<!-- Message Script -->

<script>

    function sendMessage(event) {

        event.preventDefault();

        alert(
            "Thank you! Your message has been received. 💃"
        );

        event.target.reset();

    }

</script>

</body></html>
